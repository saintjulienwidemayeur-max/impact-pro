# Render Blueprint — Impact Pro (API + storefront + Key Value/Redis; Postgres on Supabase)
# Deploy: Render dashboard → New → Blueprint → select this repo/branch. See docs/deploy-render.md.
# Database: Supabase Postgres (not created here). Use its *Session pooler* URL (port 5432, IPv4) as DATABASE_URL.

services:
  - type: keyvalue
    name: impact-pro-redis
    plan: free
    ipAllowList: []       # internal connections only

  - type: web
    name: impact-pro-api
    runtime: node
    plan: free            # free instances sleep after 15 min idle and have NO persistent disk (see docs)
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @impact-pro/api build
    startCommand: pnpm --filter @impact-pro/api start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false       # Supabase → Connect → Session pooler URL (postgres.<ref>@...pooler.supabase.com:5432)
      - key: REDIS_URL
        fromService: { type: keyvalue, name: impact-pro-redis, property: connectionString }
      - key: COOKIE_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://impact-pro-storefront.onrender.com   # change if Render assigns a different URL (e.g. custom domain)
      - key: AUTO_SEED
        value: "true"     # first deploy only: loads the catalog. Set to "false" afterwards.
      - key: UPLOAD_DIR
        value: /tmp/uploads   # ephemeral! On a paid plan add a disk and point this to its mount path (e.g. /var/data/uploads)

  - type: web
    name: impact-pro-storefront
    runtime: node
    plan: free
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @impact-pro/storefront build
    startCommand: pnpm --filter @impact-pro/storefront start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_API_URL
        value: https://impact-pro-api.onrender.com   # inlined at build time; change + redeploy if the API URL differs
      - key: NEXT_PUBLIC_SITE_URL
        value: https://impact-pro-storefront.onrender.com
      - key: NEXT_PUBLIC_WHATSAPP_NUMBER
        sync: false
