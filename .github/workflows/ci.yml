name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: impact
          POSTGRES_PASSWORD: impact_ci
          POSTGRES_DB: impact_pro_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U impact -d impact_pro_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://impact:impact_ci@localhost:5432/impact_pro_test?schema=public
      TEST_DATABASE_URL: postgresql://impact:impact_ci@localhost:5432/impact_pro_test?schema=public
      REDIS_URL: redis://localhost:6379
      COOKIE_SECRET: ci-only-cookie-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
